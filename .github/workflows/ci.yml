name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # The pipeline lives in Django-Pro-Template and is called, not copied. A
    # copied pipeline drifts, and the drift stays invisible until two
    # repositories behave differently under the same commit — which is the
    # situation this repository was extracted from.
    #
    # `app` mode skips the Postgres service, the generated config.toml, the
    # system checks and the production boot simulation. This repository is an
    # installable app, not a project: it has no manage.py and no settings
    # module, so there is nothing to boot. What remains is lint, the suite
    # against the harness in tests_harness/, and the documentation gate.
    #
    # The production boot simulation that used to run here has not been lost —
    # it belongs to whatever project installs this app, and Django-Pro-Template
    # runs it in `project` mode.
    uses: GstMirabal/Django-Pro-Template/.github/workflows/django-ci.yml@main
    with:
      mode: app
      sprint-id: "4"
