# Single source of truth for ruff.
#
# A [tool.ruff] block previously also lived in pyproject.toml. ruff resolves
# ruff.toml first, so that block was dead configuration: its line-length,
# target-version, exclude and ignore list never applied, which is why rules it
# listed as ignored kept surfacing. The settings below are the ones that block
# was trying to express; pyproject.toml no longer carries a ruff section.

target-version = "py313"
line-length = 100
exclude = ["venv", "migrations", ".agents"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "SIM", "PTH", "TD", "ERA", "PL", "RUF"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D203", "D213",
    "PLR2004",
    "TD002", "TD003",
    # Django idiom: deferred imports inside AppConfig.ready() and signal
    # receivers are how circular imports are avoided (RA-02).
    "PLC0415",
    # settings.py is declarative configuration, not a procedure; a statement
    # count ceiling does not apply to it.
    "PLR0915",
]

[lint.per-file-ignores]
# Django models/serializers/admin declare configuration through class-level
# lists (Meta.fields, REQUIRED_FIELDS, permission_classes, Meta.indexes).
# These are namespaces evaluated once at class creation, not mutable defaults
# shared between instances, and annotating them ClassVar contradicts the
# documented style of both Django and DRF.
"users/models/*.py" = ["RUF012"]
"users/serializers/*.py" = ["RUF012"]
"users/admin.py" = ["RUF012"]
"users/views.py" = ["RUF012"]
# The harness is a settings module: Django requires these names at module level.
"tests_harness/settings.py" = ["RUF012", "E501"]

# The settings package chains `from .previous import *` so each module sees the
# values the earlier ones produced — the standard Django split-settings shape.
# Modules and classes are imported explicitly in every file; only setting
# values arrive through the star import, which is what F403/F405 flag here.
"backend/config/settings/*.py" = ["F403", "F405"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
